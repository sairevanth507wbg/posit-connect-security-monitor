# Alembic configuration.
#
# The database URL is NOT stored here. alembic/env.py builds it from the same
# .env values the application uses, so credentials live in exactly one place
# and this file is safe to commit.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped revision filenames keep the versions/ directory readable.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
